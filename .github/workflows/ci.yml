name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Committed openapi.json and the generated client must match the Zod contracts.
      - name: Contract check
        run: |
          pnpm contracts:gen
          git diff --exit-code -- packages/contracts/openapi.json apps/web/src/api/generated.ts

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # Unit and integration tests; Testcontainers uses the runner's Docker.
      - name: Test
        run: pnpm turbo run test
