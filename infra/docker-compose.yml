# Local development only; these credentials never leave your machine.
name: dafter

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: dafter
      POSTGRES_PASSWORD: dafter
      POSTGRES_DB: dafter
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dafter -d dafter']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
